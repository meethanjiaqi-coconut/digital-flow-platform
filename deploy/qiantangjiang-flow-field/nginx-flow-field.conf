# 放入钱塘江现有 9091 server { ... } 内。
# 将 <FLOW_FIELD_SERVER_HOST> 替换为运行 sgxt-flow-field 的服务器地址。

location = /flow-field {
    return 301 /flow-field/;
}

# 发布接口只允许从受信网络直连 8793，并使用 Bearer Token，不经前端 nginx 暴露。
location /flow-field/internal/ {
    return 404;
}

location /flow-field/ {
    proxy_pass http://<FLOW_FIELD_SERVER_HOST>:8793/flow-field/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering on;
    client_max_body_size 4m;
}

